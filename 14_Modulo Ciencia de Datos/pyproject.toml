[project]
name = "modulo-ciencia-datos"
version = "0.1.0"
description = "Laboratorio del Modulo ciencia de datos"
authors = [
    {name = "aemusAxity",email = "aerin.mex@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.poetry]
package-mode = false

# Ignorar .venv en Black
[tool.black]
exclude = '/\.venv/'

# Ignorar .venv en isort
[tool.isort]
skip = [".venv"]

# Ignorar .venv en Ruff
[tool.ruff]
exclude = [
    ".venv",
]

[tool.mypy]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "joblib.*",
    "sklearn.*"
]
ignore_missing_imports = true
