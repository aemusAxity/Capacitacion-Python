[project]
name = "modulo-interoperabilidad-ecosistema"
version = "0.1.0"
description = "Laboratorio ultimo modulo, interoperabilidad y ecosistema mixto"
authors = [
    {name = "aemusAxity",email = "aerin.mex@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "grpcio (>=1.84.0,<2.0.0)",
    "grpcio-tools (>=1.84.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]

[tool.ruff]
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
