[project]
name = "modulo-empaquetado-distribucion-cicd"
version = "0.1.0"
description = "Laboratorio del modulo empaquetado distribucion y CI/CD"
authors = [
    {name = "aemusAxity",email = "aerin.mex@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]

[tool.ruff.lint]
select = ["E", "F", "I"]
