[project]
name = "modulo-arq-hexagonal"
version = "0.1.0"
description = "Laboratorio del modulo arquitectura hexagonal"
authors = [
    {name = "aemusAxity",email = "aerin.mex@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]
